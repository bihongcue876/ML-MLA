<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif"><defs><marker id="arrow-008F86" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#008F86" /></marker><marker id="arrow-57789E" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#57789E" /></marker><marker id="arrow-617286" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#617286" /></marker><marker id="arrow-142840" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#142840" /></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F7F9FC" stroke="none" stroke-width="1.5" /><g id="heading" data-pptx-bounds="64 28 1152 129" text-anchor="start"><text x="64" y="48" font-size="16" font-weight="bold" fill="#008F86">MLA  /  实验实现</text><text x="64" y="106" font-size="40" font-weight="bold" fill="#142840">推理时，缓存怎样建立和更新</text><text x="64" y="146" font-size="20" font-weight="normal" fill="#617286">先处理整段输入建立历史，再逐步输入新 token，并把新状态接到缓存末尾。</text></g><g id="cache-lifecycle" data-pptx-bounds="64 179 1152 359"><text x="64" y="208" font-size="26" font-weight="bold" fill="#142840" text-anchor="start">prefill：输入 a、b、c</text><text x="683" y="208" font-size="26" font-weight="bold" fill="#142840" text-anchor="start">decode：输入新 token d</text><rect x="64" y="252" width="162" height="76" rx="8" fill="#E2F2EF" stroke="none" stroke-width="1.5" /><text x="145.0" y="299.1" font-size="26" font-weight="normal" fill="#008F86" text-anchor="middle">c₁ + r₁</text><rect x="241" y="252" width="162" height="76" rx="8" fill="#E2F2EF" stroke="none" stroke-width="1.5" /><text x="322.0" y="299.1" font-size="26" font-weight="normal" fill="#008F86" text-anchor="middle">c₂ + r₂</text><rect x="418" y="252" width="162" height="76" rx="8" fill="#E2F2EF" stroke="none" stroke-width="1.5" /><text x="499.0" y="299.1" font-size="26" font-weight="normal" fill="#008F86" text-anchor="middle">c₃ + r₃</text><rect x="683" y="252" width="125" height="76" rx="8" fill="#EAF0F6" stroke="none" stroke-width="1.5" /><text x="745.5" y="297.7" font-size="22" font-weight="normal" fill="#57789E" text-anchor="middle">c₁+r₁</text><rect x="818" y="252" width="125" height="76" rx="8" fill="#EAF0F6" stroke="none" stroke-width="1.5" /><text x="880.5" y="297.7" font-size="22" font-weight="normal" fill="#57789E" text-anchor="middle">c₂+r₂</text><rect x="953" y="252" width="125" height="76" rx="8" fill="#EAF0F6" stroke="none" stroke-width="1.5" /><text x="1015.5" y="297.7" font-size="22" font-weight="normal" fill="#57789E" text-anchor="middle">c₃+r₃</text><rect x="1088" y="252" width="125" height="76" rx="8" fill="#E2F2EF" stroke="none" stroke-width="1.5" /><text x="1150.5" y="297.7" font-size="22" font-weight="normal" fill="#008F86" text-anchor="middle">c₄+r₄</text><line x1="605" y1="290" x2="664" y2="290" stroke="#008F86" stroke-width="2" marker-end="url(#arrow-008F86)" /><text x="683" y="380" font-size="22" font-weight="normal" fill="#24384D" text-anchor="start">追加新状态，然后读取第1到第4项参与注意力。</text><text x="64" y="380" font-size="24" font-weight="normal" fill="#24384D" text-anchor="start">每层返回一份 past，供下一步复用。</text><text x="64" y="439" font-size="24" font-weight="normal" fill="#24384D"><tspan x="64" dy="0">c：从 3 行潜向量变成 4 行，每行384维</tspan><tspan x="64" dy="45">r：共享位置键从 3 行变成 4 行，每行48维</tspan></text><rect x="807" y="431" width="409" height="89" rx="8" fill="#EAF0F6" stroke="none" stroke-width="1.5" /><text x="1011.5" y="484.6" font-size="26" font-weight="normal" fill="#57789E" text-anchor="middle">主模型：临时恢复 K/V</text></g><g id="cache-object" data-pptx-bounds="64 565 1152 87"><line x1="64" y1="568" x2="1216" y2="568" stroke="#D5DFE8" stroke-width="2" /><text x="64" y="608" font-size="26" font-weight="bold" fill="#008F86" text-anchor="start">持久保存的是 c 与位置键 r；是否临时展开 K/V，取决于计算路径。</text><text x="64" y="641" font-size="20" font-weight="normal" fill="#617286" text-anchor="start">我们的主模型采用恢复路径；独立层实验再比较吸收路径，下一页说明原因。</text></g><g id="footer" data-pptx-bounds="64 664 1152 32"><line x1="64" y1="665" x2="1216" y2="665" stroke="#D5DFE8" stroke-width="2" /><text x="64" y="690" font-size="16" font-weight="normal" fill="#617286" text-anchor="start">我们的MLA推理实现；图中a/b/c/d代表token编号，r即前文的位置键kᴿ</text><text x="1216" y="690" font-size="16" font-weight="normal" fill="#617286" text-anchor="end">18 / 29</text></g></svg>
