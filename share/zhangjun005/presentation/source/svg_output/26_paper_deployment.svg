<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif"><defs><marker id="arrow-008F86" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#008F86"/></marker><marker id="arrow-57789E" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#57789E"/></marker><marker id="arrow-617286" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#617286"/></marker><marker id="arrow-142840" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#142840"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F7F9FC" stroke="none" stroke-width="1.5"/><g id="heading" data-pptx-bounds="64 28 1152 129" text-anchor="start"><text x="64" y="48" font-size="16" font-weight="bold" fill="#008F86">MLA  /  论文证据</text><text x="64" y="106" font-size="40" font-weight="bold" fill="#142840">DeepSeek-V2 的实际部署效果</text><text x="64" y="146" font-size="20" font-weight="normal" fill="#617286">论文相对 DeepSeek 67B 报告的完整模型与服务系统结果。</text></g><g id="deployment-results" data-pptx-bounds="64 180 1152 131" font-weight="bold" text-anchor="start"><text x="64" y="243" font-size="60" fill="#008F86">93.3%</text><text x="64" y="292" font-size="26" fill="#142840">KV cache 减少</text><text x="683" y="243" font-size="60" fill="#008F86">5.76×</text><text x="683" y="292" font-size="26" fill="#142840">最大生成吞吐</text></g><g id="deployment-conditions" data-pptx-bounds="64 344 1152 200"><text x="64" y="376" font-size="30" font-weight="bold" fill="#142840" text-anchor="start">部署与测量条件</text><text x="64" y="424" font-size="26" font-weight="normal" fill="#24384D"><tspan x="64" dy="0">单节点 8 张 H800，FP8 权重，KV cache 平均 6 bit</tspan><tspan x="64" dy="49">按实际 DeepSeek 67B 服务的输入与生成长度分布评估</tspan></text><text x="64" y="525" font-size="26" font-weight="bold" fill="#008F86" text-anchor="start">生成吞吐 &gt;50K token/s；输入吞吐 &gt;100K token/s。</text></g><g id="deployment-attribution" data-pptx-bounds="64 565 1152 87"><line x1="64" y1="568" x2="1216" y2="568" stroke="#D5DFE8" stroke-width="2"/><text x="64" y="608" font-size="26" font-weight="bold" fill="#008F86" text-anchor="start">5.76× 包含 MLA、MoE 模型结构、量化与更大服务 batch 的共同作用。</text><text x="64" y="641" font-size="20" font-weight="normal" fill="#617286" text-anchor="start">这是服务总吞吐比较；论文该段未给固定长度和确切batch值，不等于单请求快5.76倍。</text></g><g id="footer" data-pptx-bounds="64 664 1152 32"><line x1="64" y1="665" x2="1216" y2="665" stroke="#D5DFE8" stroke-width="2"/><text x="64" y="690" font-size="16" font-weight="normal" fill="#617286" text-anchor="start">文献：DeepSeek-V2 v5；原文位置与详细引用见资料来源表</text><text x="1216" y="690" font-size="16" font-weight="normal" fill="#617286" text-anchor="end">26 / 29</text></g></svg>