<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif"><defs><marker id="arrow-008F86" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#008F86" /></marker><marker id="arrow-57789E" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#57789E" /></marker><marker id="arrow-617286" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#617286" /></marker><marker id="arrow-142840" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#142840" /></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F7F9FC" stroke="none" stroke-width="1.5" /><g id="heading" data-pptx-bounds="64 28 1152 129" text-anchor="start"><text x="64" y="48" font-size="16" font-weight="bold" fill="#008F86">MLA  /  实验实现</text><text x="64" y="106" font-size="40" font-weight="bold" fill="#142840">图里的三个指标怎样得到</text><text x="64" y="146" font-size="20" font-weight="normal" fill="#617286">每个图表都对应程序里的一个输出对象和一种统计方法。</text></g><g id="metric-provenance" data-pptx-bounds="64 183 1152 340" text-anchor="start"><text x="64" y="222" font-size="30" font-weight="bold" fill="#008F86">模型质量</text><text x="308" y="222" font-size="26" font-weight="normal" fill="#142840">验证文本 → 模型预测 → 平均交叉熵 → 取指数</text><text x="308" y="265" font-size="22" font-weight="normal" fill="#617286">得到 PPL，越低越好。</text><text x="64" y="345" font-size="30" font-weight="bold" fill="#008F86">缓存容量</text><text x="308" y="345" font-size="26" font-weight="normal" fill="#142840">prefill 返回 past → 逐层逐张量累加字节</text><text x="308" y="388" font-size="22" font-weight="normal" fill="#617286">统一 BF16，只统计缓存张量。</text><text x="64" y="468" font-size="30" font-weight="bold" fill="#008F86">计算时间</text><text x="308" y="468" font-size="26" font-weight="normal" fill="#142840">CUDA 事件测 decode → 汇总每轮 → 比较两路径</text><text x="308" y="511" font-size="22" font-weight="normal" fill="#617286">吸收耗时 / 恢复耗时，大于1更慢。</text></g><g id="measurement-source" data-pptx-bounds="64 565 1152 87"><line x1="64" y1="568" x2="1216" y2="568" stroke="#D5DFE8" stroke-width="2" /><text x="64" y="608" font-size="26" font-weight="bold" fill="#008F86" text-anchor="start">先明确测量对象，再比较数值：PPL、缓存字节与单层时延各有含义。</text><text x="64" y="641" font-size="20" font-weight="normal" fill="#617286" text-anchor="start">本次使用留存结果复算与绘图，没有重跑训练或GPU性能测量。</text></g><g id="footer" data-pptx-bounds="64 664 1152 32"><line x1="64" y1="665" x2="1216" y2="665" stroke="#D5DFE8" stroke-width="2" /><text x="64" y="690" font-size="16" font-weight="normal" fill="#617286" text-anchor="start">我们的实验统计口径；PPL来自两种子记录，缓存字节按元素数×每元素字节数累加</text><text x="1216" y="690" font-size="16" font-weight="normal" fill="#617286" text-anchor="end">21 / 29</text></g></svg>
