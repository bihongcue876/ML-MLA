<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif"><defs><marker id="arrow-008F86" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#008F86" /></marker><marker id="arrow-57789E" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#57789E" /></marker><marker id="arrow-617286" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#617286" /></marker><marker id="arrow-142840" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#142840" /></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F7F9FC" stroke="none" stroke-width="1.5" /><g id="heading" data-pptx-bounds="64 28 1152 129" text-anchor="start"><text x="64" y="48" font-size="16" font-weight="bold" fill="#008F86">MLA  /  实验实现</text><text x="64" y="106" font-size="40" font-weight="bold" fill="#142840">两种注意力计算怎样比较</text><text x="64" y="146" font-size="20" font-weight="normal" fill="#617286">输入直接使用隐向量，不经过语言模型训练；正确性检查与计时分别执行。</text></g><g id="benchmark-procedure" data-pptx-bounds="64 178 1152 372"><text x="64" y="210" font-size="26" font-weight="bold" fill="#142840" text-anchor="start">1. 小输入检查计算对应</text><rect x="64" y="238" width="493" height="68" rx="8" fill="#EAF0F6" stroke="none" stroke-width="1.5" /><text x="310.5" y="279.7" font-size="22" font-weight="normal" fill="#57789E" text-anchor="middle">复制同一权重，同输入比较 FP32 输出</text><text x="683" y="210" font-size="26" font-weight="bold" fill="#142840" text-anchor="start">2. 另建 BF16 计时实例</text><rect x="683" y="238" width="533" height="68" rx="8" fill="#EAF0F6" stroke="none" stroke-width="1.5" /><text x="949.5" y="280.4" font-size="24" font-weight="normal" fill="#57789E" text-anchor="middle">分别初始化，使用同形状的随机输入</text><line x1="570" y1="272" x2="667" y2="272" stroke="#57789E" stroke-width="2" marker-end="url(#arrow-57789E)" /><line x1="949" y1="317" x2="949" y2="363" stroke="#008F86" stroke-width="2" marker-end="url(#arrow-008F86)" /><text x="683" y="400" font-size="26" font-weight="bold" fill="#142840" text-anchor="start">3. 建立相同长度的历史</text><rect x="683" y="429" width="533" height="68" rx="8" fill="#E2F2EF" stroke="none" stroke-width="1.5" /><text x="949.5" y="471.4" font-size="24" font-weight="normal" fill="#008F86" text-anchor="middle">分块输入隐向量，填好各自的缓存</text><line x1="667" y1="463" x2="570" y2="463" stroke="#008F86" stroke-width="2" marker-end="url(#arrow-008F86)" /><text x="64" y="400" font-size="26" font-weight="bold" fill="#142840" text-anchor="start">4. 新输入到输出，测一次前向</text><rect x="64" y="429" width="493" height="68" rx="8" fill="#E2F2EF" stroke="none" stroke-width="1.5" /><text x="310.5" y="471.4" font-size="24" font-weight="normal" fill="#008F86" text-anchor="middle">CUDA 计时 → 同步 → 记录毫秒</text><text x="64" y="540" font-size="24" font-weight="normal" fill="#617286" text-anchor="start">每轮24个decode步骤，每种实现3轮；分别取轮摘要中位数后相除。</text></g><g id="benchmark-controls" data-pptx-bounds="64 565 1152 87"><line x1="64" y1="568" x2="1216" y2="568" stroke="#D5DFE8" stroke-width="2" /><text x="64" y="608" font-size="26" font-weight="bold" fill="#008F86" text-anchor="start">计时控制结构参数与输入形状；没有逐步配对同权重、同数值输入。</text><text x="64" y="641" font-size="20" font-weight="normal" fill="#617286" text-anchor="start">每步包含缓存更新；小输入精度检查不等于长序列验证，随机输入不衡量语言质量。</text></g><g id="footer" data-pptx-bounds="64 664 1152 32"><line x1="64" y1="665" x2="1216" y2="665" stroke="#D5DFE8" stroke-width="2" /><text x="64" y="690" font-size="16" font-weight="normal" fill="#617286" text-anchor="start">我们的独立层测量实现；BF16，16K/32K，历史RTX4050 Laptop记录，完整配置见附录</text><text x="1216" y="690" font-size="16" font-weight="normal" fill="#617286" text-anchor="end">20 / 29</text></g></svg>
