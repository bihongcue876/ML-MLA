chor="middle">归一化 + 前馈</text><line x1="985" y1="443" x2="998" y2="443" stroke="#57789E" stroke-width="2" marker-end="url(#arrow-57789E)" /><rect x="1000" y="408" width="216" height="70" rx="8" fill="#EAF0F6" stroke="none" stroke-width="1.5" /><text x="1108.0" y="451.4" font-size="24" font-weight="normal" fill="#142840" text-anchor="middle">再加回输入</text><text x="300" y="522" font-size="26" font-weight="bold" fill="#008F86" text-anchor="start">替换这里：MHA / GQA-4 / MLA</text></g><g id="module-boundary" data-pptx-bounds="64 565 1152 87"><line x1="64" y1="568" x2="1216" y2="568" stroke="#D5DFE8" stroke-width="2" /><text x="64" y="608" font-size="26" font-weight="bold" fill="#008F86" text-anchor="start">词嵌入、前馈网络和训练任务相同，比较集中在注意力模块。</text><text x="64" y="641" font-size="20" font-weight="normal" fill="#617286" text-anchor="start">MLA 保留联合压缩与解耦位置分支；我们的查询直接投影，省略论文的查询低秩分支。</text></g><g id="footer" data-pptx-bounds="64 664 1152 32"><line x1="64" y1="665" x2="1216" y2="665" stroke="#D5DFE8" stroke-width="2" /><text x="64" y="690" font-size="16" font-weight="normal" fill="#617286" text-anchor="start">实现依据：共同Transformer骨架与三种注意力模块；层内残差连接在备注中展开</text><text x="1216" y="690" font-size="16" font-weight="normal" fill="#617286" text-anchor="end">16 / 29</text></g></svg>
