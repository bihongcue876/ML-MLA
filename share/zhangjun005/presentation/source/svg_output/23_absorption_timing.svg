8921540772" r="5" fill="#57789E"/><line x1="235.0" y1="487.25813361895837" x2="405.0" y2="405.6786635273013" stroke="#008F86" stroke-width="3"/><line x1="405.0" y1="405.6786635273013" x2="575.0" y2="375.1978121423439" stroke="#008F86" stroke-width="3"/><line x1="575.0" y1="375.1978121423439" x2="745.0" y2="278.09819545348023" stroke="#008F86" stroke-width="3"/><circle cx="235.0" cy="487.25813361895837" r="5" fill="#008F86"/><circle cx="405.0" cy="405.6786635273013" r="5" fill="#008F86"/><circle cx="575.0" cy="375.1978121423439" r="5" fill="#008F86"/><circle cx="745.0" cy="278.09819545348023" r="5" fill="#008F86"/><text x="235.0" y="568" font-size="20" font-weight="normal" fill="#24384D" text-anchor="middle">128</text><text x="405.0" y="568" font-size="20" font-weight="normal" fill="#24384D" text-anchor="middle">192</text><text x="575.0" y="568" font-size="20" font-weight="normal" fill="#24384D" text-anchor="middle">256</text><text x="745.0" y="568" font-size="20" font-weight="normal" fill="#24384D" text-anchor="middle">384</text></g></g><line x1="150" y1="477.0" x2="830" y2="477.0" stroke="#617286" stroke-width="1.5" stroke-dasharray="6 5"/><text x="835" y="469.0" font-size="18" font-weight="normal" fill="#617286" text-anchor="end">持平</text><text x="150" y="210" font-size="24" font-weight="bold" fill="#142840" text-anchor="start">耗时比：吸收 / 恢复 K/V</text><line x1="490" y1="203" x2="520" y2="203" stroke="#57789E" stroke-width="3"/><text x="531" y="210" font-size="20" font-weight="normal" fill="#617286" text-anchor="start">16K</text><line x1="655" y1="203" x2="685" y2="203" stroke="#008F86" stroke-width="3"/><text x="696" y="210" font-size="20" font-weight="normal" fill="#617286" text-anchor="start">32K</text><text x="150" y="616" font-size="22" font-weight="normal" fill="#617286" text-anchor="start">潜向量宽度 d_c（类别等距）</text></g><g id="layer-reading" data-pptx-bounds="876 178 340 468"><text x="900" y="212" font-size="26" font-weight="bold" fill="#142840" text-anchor="start">读图方法</text><text x="900" y="258" font-size="24" font-weight="normal" fill="#24384D" text-anchor="start">比值 &gt; 1：吸收更慢</text><text x="900" y="300" font-size="24" font-weight="normal" fill="#24384D" text-anchor="start">比值 &lt; 1：吸收更快</text><line x1="900" y1="331" x2="1216" y2="331" stroke="#D5DFE8" stroke-width="2"/><text x="900" y="377" font-size="24" font-weight="bold" fill="#008F86" text-anchor="start">32K、d_c=128：0.965</text><text x="900" y="421" font-size="20" font-weight="normal" fill="#617286" text-anchor="start">这是3轮测量的探索性观察，</text><text x="900" y="453" font-size="20" font-weight="normal" fill="#617286" text-anchor="start">不是稳定的加速门槛。</text><text x="900" y="514" font-size="20" font-weight="normal" fill="#24384D" text-anchor="start">潜宽改变计算量与张量形状，</text><text x="900" y="546" font-size="20" font-weight="normal" fill="#24384D" text-anchor="start">内核实现也会影响速度。</text><text x="900" y="606" font-size="20" font-weight="normal" fill="#617286" text-anchor="start">该潜宽未评估语言质量。</text></g><g id="footer" data-pptx-bounds="64 664 1152 32"><line x1="64" y1="665" x2="1216" y2="665" stroke="#D5DFE8" stroke-width="2"/><text x="64" y="690" font-size="16" font-weight="normal" fill="#617286" text-anchor="start">我们的实验实现与留存记录；对应代码与测量条件见资料来源表</text><text x="1216" y="690" font-size="16" font-weight="normal" fill="#617286" text-anchor="end">23 / 29</text></g></svg>