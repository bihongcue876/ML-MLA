<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif"><defs><marker id="arrow-008F86" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#008F86" /></marker><marker id="arrow-57789E" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#57789E" /></marker><marker id="arrow-617286" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#617286" /></marker><marker id="arrow-142840" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#142840" /></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F7F9FC" stroke="none" stroke-width="1.5" /><g id="heading" data-pptx-bounds="64 28 1152 129" text-anchor="start"><text x="64" y="48" font-size="16" font-weight="bold" fill="#008F86">MLA  /  原理图解</text><text x="64" y="106" font-size="40" font-weight="bold" fill="#142840">多个头怎样共用历史潜向量</text><text x="64" y="146" font-size="20" font-weight="normal" fill="#617286">推广到 T 个历史 token：共享的是缓存来源，各头的查询、权重与输出仍然不同。</text></g><g id="multihead-direct" data-pptx-bounds="64 180 1152 370"><text x="64" y="207" font-size="26" font-weight="bold" fill="#008F86" text-anchor="start">一份历史缓存</text><rect x="64" y="241" width="218" height="42" rx="8" fill="#E2F2EF" stroke="none" stroke-width="1.5" /><text x="173.0" y="271.1" font-size="26" font-weight="normal" fill="#008F86" text-anchor="middle">c1</text><rect x="64" y="297" width="218" height="42" rx="8" fill="#E2F2EF" stroke="none" stroke-width="1.5" /><text x="173.0" y="327.1" font-size="26" font-weight="normal" fill="#008F86" text-anchor="middle">c2</text><rect x="64" y="353" width="218" height="42" rx="8" fill="#E2F2EF" stroke="none" stroke-width="1.5" /><text x="173.0" y="383.1" font-size="26" font-weight="normal" fill="#008F86" text-anchor="middle">c3</text><rect x="64" y="409" width="218" height="42" rx="8" fill="#E2F2EF" stroke="none" stroke-width="1.5" /><text x="173.0" y="439.1" font-size="26" font-weight="normal" fill="#008F86" text-anchor="middle">c4</text><text x="164" y="508" font-size="22" font-weight="normal" fill="#617286" text-anchor="middle">… 共 T 行</text><text x="419" y="239" font-size="26" font-weight="bold" fill="#142840" text-anchor="start">头1：当前查询先做各自的变换</text><line x1="296" y1="296" x2="409" y2="296" stroke="#008F86" stroke-width="2" marker-end="url(#arrow-008F86)" /><rect x="419" y="257" width="797" height="76" rx="8" fill="#E2F2EF" stroke="none" stroke-width="1.5" /><text x="817.5" y="304.1" font-size="26" font-weight="normal" fill="#008F86" text-anchor="middle">变换后的查询与历史 c 打分，再对 c 加权</text><text x="419" y="364" font-size="20" font-weight="normal" fill="#617286" text-anchor="start">只对该头的聚合结果做值/输出投影</text><text x="419" y="405" font-size="26" font-weight="bold" fill="#142840" text-anchor="start">头2：当前查询先做各自的变换</text><line x1="296" y1="462" x2="409" y2="462" stroke="#008F86" stroke-width="2" marker-end="url(#arrow-008F86)" /><rect x="419" y="423" width="797" height="76" rx="8" fill="#E2F2EF" stroke="none" stroke-width="1.5" /><text x="817.5" y="470.1" font-size="26" font-weight="normal" fill="#008F86" text-anchor="middle">变换后的查询与历史 c 打分，再对 c 加权</text><text x="419" y="530" font-size="20" font-weight="normal" fill="#617286" text-anchor="start">只对该头的聚合结果做值/输出投影</text></g><g id="avoided-tensor" data-pptx-bounds="64 565 1152 87"><line x1="64" y1="568" x2="1216" y2="568" stroke="#D5DFE8" stroke-width="2" /><text x="64" y="608" font-size="26" font-weight="bold" fill="#008F86" text-anchor="start">避开的是“头数 × 历史长度 × 头宽”的整段历史 K/V 中间张量。</text><text x="64" y="641" font-size="20" font-weight="normal" fill="#617286" text-anchor="start">仍会读取全部历史 c，也会产生每头的当前查询与聚合结果；数学重排不保证实际时延下降。</text></g><g id="footer" data-pptx-bounds="64 664 1152 32"><line x1="64" y1="665" x2="1216" y2="665" stroke="#D5DFE8" stroke-width="2" /><text x="64" y="690" font-size="16" font-weight="normal" fill="#617286" text-anchor="start">原理：DeepSeek-V2 §2.1 / Appendix C；图中仅画两个头，省略位置分支</text><text x="1216" y="690" font-size="16" font-weight="normal" fill="#617286" text-anchor="end">11 / 29</text></g></svg>
