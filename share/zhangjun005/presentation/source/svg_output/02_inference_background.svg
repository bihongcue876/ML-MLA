<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif"><defs><marker id="arrow-008F86" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#008F86"/></marker><marker id="arrow-57789E" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#57789E"/></marker><marker id="arrow-617286" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#617286"/></marker><marker id="arrow-142840" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#142840"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F7F9FC" stroke="none" stroke-width="1.5"/><g id="heading" data-pptx-bounds="64 28 1152 129" text-anchor="start"><text x="64" y="48" font-size="16" font-weight="bold" fill="#008F86">MLA  /  研究背景</text><text x="64" y="106" font-size="40" font-weight="bold" fill="#142840">大语言模型推理中的长上下文问题</text><text x="64" y="146" font-size="20" font-weight="normal" fill="#617286">语言模型逐个生成 token（文本单位），每一步都需要利用已有上下文。</text></g><g id="generation" data-pptx-bounds="64 181 1152 365"><text x="64" y="211" font-size="30" font-weight="bold" fill="#142840" text-anchor="start">自回归生成</text><text x="64" y="253" font-size="24" font-weight="normal" fill="#617286" text-anchor="start">已有文本</text><rect x="64" y="277" width="330" height="76" rx="8" fill="#EAF0F6" stroke="none" stroke-width="1.5"/><text x="229.0" y="324.8" font-size="28" font-weight="normal" fill="#57789E" text-anchor="middle">输入序列</text><line x1="404" y1="315" x2="448" y2="315" stroke="#57789E" stroke-width="2" marker-end="url(#arrow-57789E)"/><rect x="458" y="277" width="307" height="76" rx="8" fill="#E2F2EF" stroke="none" stroke-width="1.5"/><text x="611.5" y="324.1" font-size="26" font-weight="normal" fill="#008F86" text-anchor="middle">生成 token 1</text><line x1="775" y1="315" x2="819" y2="315" stroke="#008F86" stroke-width="2" marker-end="url(#arrow-008F86)"/><rect x="829" y="277" width="387" height="76" rx="8" fill="#E2F2EF" stroke="none" stroke-width="1.5"/><text x="1022.5" y="324.1" font-size="26" font-weight="normal" fill="#008F86" text-anchor="middle">继续生成 token 2</text><text x="64" y="405" font-size="26" font-weight="normal" fill="#24384D" text-anchor="start">第一步：根据输入序列生成 token 1</text><text x="64" y="452" font-size="26" font-weight="normal" fill="#24384D" text-anchor="start">第二步：根据输入序列和 token 1 生成 token 2</text><text x="64" y="520" font-size="26" font-weight="bold" fill="#142840" text-anchor="start">后续每一步都要访问越来越多的历史信息。</text></g><g id="background-implication" data-pptx-bounds="64 565 1152 87"><line x1="64" y1="568" x2="1216" y2="568" stroke="#D5DFE8" stroke-width="2"/><text x="64" y="608" font-size="26" font-weight="bold" fill="#008F86" text-anchor="start">上下文越长、并发请求越多，需要保留的历史状态越大。</text><text x="64" y="641" font-size="20" font-weight="normal" fill="#617286" text-anchor="start">MLA 关注其中的键值缓存（KV cache）：怎样减少它的存储与读取负担。</text></g><g id="footer" data-pptx-bounds="64 664 1152 32"><line x1="64" y1="665" x2="1216" y2="665" stroke="#D5DFE8" stroke-width="2"/><text x="64" y="690" font-size="16" font-weight="normal" fill="#617286" text-anchor="start">原理依据：DeepSeek-V2 §2.1</text><text x="1216" y="690" font-size="16" font-weight="normal" fill="#617286" text-anchor="end">02 / 29</text></g></svg>