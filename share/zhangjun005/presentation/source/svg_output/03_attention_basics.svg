y="452" font-size="26" font-weight="bold" fill="#142840">Value：值</text><text x="124" y="489" font-size="20" font-weight="normal" fill="#617286">历史 token 提供什么信息</text></g><g id="attention-example" data-pptx-bounds="510 179 706 357"><text x="534" y="211" font-size="26" font-weight="bold" fill="#142840" text-anchor="start">1. 点积打分</text><rect x="534" y="231" width="132" height="52" rx="8" fill="#E2F2EF" stroke="none" stroke-width="1.5"/><text x="600.0" y="267.5" font-size="30" font-weight="normal" fill="#008F86" text-anchor="middle">q</text><rect x="754" y="231" width="125" height="52" rx="8" fill="#EAF0F6" stroke="none" stroke-width="1.5"/><text x="816.5" y="266.8" font-size="28" font-weight="normal" fill="#57789E" text-anchor="middle">k1</text><rect x="909" y="231" width="125" height="52" rx="8" fill="#EAF0F6" stroke="none" stroke-width="1.5"/><text x="971.5" y="266.8" font-size="28" font-weight="normal" fill="#57789E" text-anchor="middle">k2</text><rect x="1064" y="231" width="125" height="52" rx="8" fill="#EAF0F6" stroke="none" stroke-width="1.5"/><text x="1126.5" y="266.8" font-size="28" font-weight="normal" fill="#57789E" text-anchor="middle">k3</text><text x="534" y="338" font-size="26" font-weight="bold" fill="#142840" text-anchor="start">2. softmax 将分数变为权重</text><rect x="754" y="358" width="125" height="52" rx="8" fill="#E2F2EF" stroke="none" stroke-width="1.5"/><text x="816.5" y="393.8" font-size="28" font-weight="normal" fill="#008F86" text-anchor="middle">0.2</text><rect x="909" y="358" width="125" height="52" rx="8" fill="#E2F2EF" stroke="none" stroke-width="1.5"/><text x="971.5" y="393.8" font-size="28" font-weight="normal" fill="#008F86" text-anchor="middle">0.3</text><rect x="1064" y="358" width="125" height="52" rx="8" fill="#E2F2EF" stroke="none" stroke-width="1.5"/><text x="1126.5" y="393.8" font-size="28" font-weight="normal" fill="#008F86" text-anchor="middle">0.5</text><text x="534" y="464" font-size="26" font-weight="bold" fill="#142840" text-anchor="start">3. 按权重加权求和</text><text x="534" y="512" font-size="30" font-weight="normal" fill="#008F86" text-anchor="start">输出 = 0.2 v₁ + 0.3 v₂ + 0.5 v₃</text></g><g id="multihead-intro" data-pptx-bounds="64 565 1152 87"><line x1="64" y1="568" x2="1216" y2="568" stroke="#D5DFE8" stroke-width="2"/><text x="64" y="608" font-size="26" font-weight="bold" fill="#008F86" text-anchor="start">多头注意力：并行计算多组 Q/K/V，再合并各头输出。</text><text x="64" y="641" font-size="20" font-weight="normal" fill="#617286" text-anchor="start">后续生成仍会使用历史 K/V，因此可以把它们保存下来；权重数值仅作示意。</text></g><g id="footer" data-pptx-bounds="64 664 1152 32"><line x1="64" y1="665" x2="1216" y2="665" stroke="#D5DFE8" stroke-width="2"/><text x="64" y="690" font-size="16" font-weight="normal" fill="#617286" text-anchor="start">原理依据：DeepSeek-V2 §2.1</text><text x="1216" y="690" font-size="16" font-weight="normal" fill="#617286" text-anchor="end">03 / 29</text></g></svg>