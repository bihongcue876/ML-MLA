<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif"><defs><marker id="arrow-008F86" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#008F86"/></marker><marker id="arrow-57789E" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#57789E"/></marker><marker id="arrow-617286" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#617286"/></marker><marker id="arrow-142840" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#142840"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F7F9FC" stroke="none" stroke-width="1.5"/><g id="heading" data-pptx-bounds="64 28 1152 129" text-anchor="start"><text x="64" y="48" font-size="16" font-weight="bold" fill="#008F86">MLA  /  MLA 原理</text><text x="64" y="106" font-size="40" font-weight="bold" fill="#142840">位置编码对矩阵吸收的影响</text><text x="64" y="146" font-size="20" font-weight="normal" fill="#617286">前面只讨论内容；语言模型还必须区分词的顺序。</text></g><g id="position-motivation" data-pptx-bounds="64 178 1152 99" text-anchor="start"><text x="64" y="210" font-size="30" font-weight="bold" fill="#142840">“小明帮助小红”</text><text x="685" y="210" font-size="30" font-weight="bold" fill="#142840">“小红帮助小明”</text><text x="64" y="258" font-size="26" font-weight="normal" fill="#617286">词相同，语序不同，表达的关系也不同。</text></g><g id="rope-definition" data-pptx-bounds="64 294 1152 90" text-anchor="start"><text x="64" y="322" font-size="30" font-weight="bold" fill="#142840">RoPE（旋转位置编码）</text><text x="64" y="364" font-size="26" font-weight="normal" fill="#24384D">按 token 位置旋转查询与键，让点积反映相对位置。</text></g><g id="rope-obstacle" data-pptx-replace-with="formula" data-pptx-x="64" data-pptx-y="399" data-pptx-width="1152" data-pptx-height="85" data-pptx-bounds="64 399 1152 85"><metadata type="application/json">{"latex": "(R_tq)^T(R_jW_i^Kc_j)=q^TR_t^TR_jW_i^Kc_j", "display": "block", "font_size": 34, "color": "#142840", "align": "center"}</metadata><text x="640.0" y="452.72" font-family="Cambria Math, serif" font-size="34" font-weight="normal" fill="#142840" text-anchor="middle">(Rₜq)ᵀ(RⱼWᴷᵢcⱼ) = qᵀRₜᵀRⱼWᴷᵢcⱼ</text></g><g id="rotation-dependence" data-pptx-bounds="64 494 1152 46"><text x="64" y="524" font-size="24" font-weight="normal" fill="#617286" text-anchor="start">t 为当前位置，j 为历史位置；中间的 RₜᵀRⱼ 随 j 改变。</text></g><g id="rope-consequence" data-pptx-bounds="64 565 1152 87"><line x1="64" y1="568" x2="1216" y2="568" stroke="#D5DFE8" stroke-width="2"/><text x="64" y="608" font-size="26" font-weight="bold" fill="#008F86" text-anchor="start">键上投影不能简单地吸收到一个固定的当前查询变换中。</text><text x="64" y="641" font-size="20" font-weight="normal" fill="#617286" text-anchor="start">MLA 因此把位置编码从内容分支中分离；这不表示普通 RoPE 不能缓存。</text></g><g id="footer" data-pptx-bounds="64 664 1152 32"><line x1="64" y1="665" x2="1216" y2="665" stroke="#D5DFE8" stroke-width="2"/><text x="64" y="690" font-size="16" font-weight="normal" fill="#617286" text-anchor="start">原理依据：DeepSeek-V2 §2.1</text><text x="1216" y="690" font-size="16" font-weight="normal" fill="#617286" text-anchor="end">12 / 29</text></g></svg>