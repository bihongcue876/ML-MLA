<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif"><defs><marker id="arrow-008F86" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#008F86"/></marker><marker id="arrow-57789E" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#57789E"/></marker><marker id="arrow-617286" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#617286"/></marker><marker id="arrow-142840" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#142840"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F7F9FC" stroke="none" stroke-width="1.5"/><g id="heading" data-pptx-bounds="64 28 1152 129" text-anchor="start"><text x="64" y="48" font-size="16" font-weight="bold" fill="#008F86">MLA  /  总结</text><text x="64" y="106" font-size="40" font-weight="bold" fill="#142840">总结</text><text x="64" y="146" font-size="20" font-weight="normal" fill="#617286">MLA 从历史状态的表示出发，把缓存压缩与推理计算结合起来。</text></g><g id="technical-conclusion" data-pptx-bounds="64 180 1152 291" text-anchor="start"><text x="64" y="212" font-size="30" font-weight="bold" fill="#008F86">联合低秩表示</text><text x="64" y="254" font-size="26" font-weight="normal" fill="#24384D">各头内容键和值共用潜向量，减少持久缓存。</text><text x="64" y="313" font-size="30" font-weight="bold" fill="#008F86">解耦位置编码</text><text x="64" y="355" font-size="26" font-weight="normal" fill="#24384D">位置分支单独处理 RoPE，内容分支保持线性。</text><text x="64" y="414" font-size="30" font-weight="bold" fill="#008F86">矩阵吸收</text><text x="64" y="456" font-size="26" font-weight="normal" fill="#24384D">改变键匹配和值聚合的顺序，直接利用潜缓存。</text></g><g id="evidence-conclusion" data-pptx-bounds="64 489 1152 159"><line x1="64" y1="493" x2="1216" y2="493" stroke="#D5DFE8" stroke-width="2"/><text x="64" y="535" font-size="26" font-weight="bold" fill="#142840" text-anchor="start">我们的实验：缓存压缩 3.556×，当前配置仍有质量与实现开销。</text><text x="64" y="585" font-size="24" font-weight="normal" fill="#24384D" text-anchor="start">论文服务：最大生成吞吐 5.76×，需要连同模型、量化和批量条件解释。</text><text x="64" y="635" font-size="26" font-weight="bold" fill="#008F86" text-anchor="start">缓存收益、模型质量和服务速度，需要各自的比较与证据。</text></g><g id="footer" data-pptx-bounds="64 664 1152 32"><line x1="64" y1="665" x2="1216" y2="665" stroke="#D5DFE8" stroke-width="2"/><text x="64" y="690" font-size="16" font-weight="normal" fill="#617286" text-anchor="start">文献：DeepSeek-V2 v5；原文位置与详细引用见资料来源表</text><text x="1216" y="690" font-size="16" font-weight="normal" fill="#617286" text-anchor="end">28 / 29</text></g></svg>