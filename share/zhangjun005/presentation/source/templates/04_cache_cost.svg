<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif"><defs><marker id="arrow-008F86" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#008F86"/></marker><marker id="arrow-57789E" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#57789E"/></marker><marker id="arrow-617286" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#617286"/></marker><marker id="arrow-142840" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#142840"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F7F9FC" stroke="none" stroke-width="1.5"/><g id="heading" data-pptx-bounds="64 28 1152 129" text-anchor="start"><text x="64" y="48" font-size="16" font-weight="bold" fill="#008F86">MLA  /  研究背景</text><text x="64" y="106" font-size="40" font-weight="bold" fill="#142840">KV cache 的作用与显存开销</text><text x="64" y="146" font-size="20" font-weight="normal" fill="#617286">缓存各层历史 K/V，下一步可以直接复用，避免重复计算历史投影。</text></g><g id="cache-reuse" data-pptx-bounds="64 179 1152 175"><text x="64" y="206" font-size="26" font-weight="bold" fill="#142840" text-anchor="start">prefill：处理输入</text><text x="64" y="246" font-size="22" font-weight="normal" fill="#617286" text-anchor="start">并行计算输入 token 的 K/V</text><rect x="64" y="269" width="432" height="68" rx="8" fill="#EAF0F6" stroke="none" stroke-width="1.5"/><text x="280.0" y="312.8" font-size="28" font-weight="normal" fill="#57789E" text-anchor="middle">历史 K / V cache</text><text x="683" y="206" font-size="26" font-weight="bold" fill="#142840" text-anchor="start">decode：逐步生成</text><text x="683" y="246" font-size="22" font-weight="normal" fill="#617286" text-anchor="start">读取历史 K/V，追加当前 token 的 K/V</text><rect x="683" y="269" width="533" height="68" rx="8" fill="#E2F2EF" stroke="none" stroke-width="1.5"/><text x="949.5" y="312.8" font-size="28" font-weight="normal" fill="#008F86" text-anchor="middle">旧 cache  +  当前 K / V</text><line x1="506" y1="303" x2="671" y2="303" stroke="#008F86" stroke-width="2" marker-end="url(#arrow-008F86)"/></g><g id="kv-bytes" data-pptx-replace-with="formula" data-pptx-x="64" data-pptx-y="371" data-pptx-width="1152" data-pptx-height="67" data-pptx-bounds="64 371 1152 67"><metadata type="application/json">{"latex": "M_{KV}=BTL(2n_{kv}d_h)s", "display": "block", "font_size": 32, "color": "#142840", "align": "center"}</metadata><text x="640.0" y="415.06" font-family="Cambria Math, serif" font-size="32" font-weight="normal" fill="#142840" text-anchor="middle">缓存字节数 = B × T × L × (2 n_kv d_h) × s</text></g><g id="formula-symbols" data-pptx-bounds="64 446 1152 39"><text x="64" y="472" font-size="22" font-weight="normal" fill="#617286" text-anchor="start">B：请求数  T：长度  L：层数  n_kv：KV头数  d_h：头宽  s：每元素字节数</text></g><g id="cache-scale-example" data-pptx-bounds="64 506 1152 138"><rect x="64" y="506" width="1152" height="138" rx="0" fill="#EAF0F6" stroke="none" stroke-width="1.5"/><text x="88" y="547" font-size="24" font-weight="bold" fill="#142840" text-anchor="start">估算示例</text><text x="88" y="589" font-size="24" font-weight="normal" fill="#24384D" text-anchor="start">32 层 × 32 个 KV 头 × 头宽 128 × BF16</text><text x="88" y="625" font-size="20" font-weight="normal" fill="#617286" text-anchor="start">只算 KV，不含权重与工作空间；不是实验测量。</text><text x="900" y="563" font-size="26" font-weight="normal" fill="#617286" text-anchor="start">8K token</text><text x="900" y="618" font-size="50" font-weight="bold" fill="#008F86" text-anchor="start">4 GiB</text></g><g id="footer" data-pptx-bounds="64 664 1152 32"><line x1="64" y1="665" x2="1216" y2="665" stroke="#D5DFE8" stroke-width="2"/><text x="64" y="690" font-size="16" font-weight="normal" fill="#617286" text-anchor="start">原理依据：DeepSeek-V2 §2.1</text><text x="1216" y="690" font-size="16" font-weight="normal" fill="#617286" text-anchor="end">04 / 29</text></g></svg>