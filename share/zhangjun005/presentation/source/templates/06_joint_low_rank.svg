<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif"><defs><marker id="arrow-008F86" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#008F86"/></marker><marker id="arrow-57789E" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#57789E"/></marker><marker id="arrow-617286" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#617286"/></marker><marker id="arrow-142840" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#142840"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F7F9FC" stroke="none" stroke-width="1.5"/><g id="heading" data-pptx-bounds="64 28 1152 129" text-anchor="start"><text x="64" y="48" font-size="16" font-weight="bold" fill="#008F86">MLA  /  MLA 原理</text><text x="64" y="106" font-size="40" font-weight="bold" fill="#142840">MLA 的联合低秩表示</text><text x="64" y="146" font-size="20" font-weight="normal" fill="#617286">潜向量 c 是各头内容键 K 和值 V 的共同低维来源，K/V 因而可以联合压缩。</text></g><g id="joint-low-rank" data-pptx-bounds="64 180 1152 346"><rect x="64" y="283" width="112" height="92" rx="8" fill="#EAF0F6" stroke="none" stroke-width="1.5"/><text x="120.0" y="340.9" font-size="34" font-weight="normal" fill="#142840" text-anchor="middle">h</text><text x="64" y="420" font-size="22" font-weight="normal" fill="#617286" text-anchor="start">输入隐状态</text><line x1="186" y1="329" x2="235" y2="329" stroke="#57789E" stroke-width="2" marker-end="url(#arrow-57789E)"/><rect x="245" y="283" width="160" height="92" rx="8" fill="#EAF0F6" stroke="none" stroke-width="1.5"/><text x="325.0" y="338.1" font-size="26" font-weight="normal" fill="#57789E" text-anchor="middle">下投影</text><line x1="415" y1="329" x2="464" y2="329" stroke="#008F86" stroke-width="2" marker-end="url(#arrow-008F86)"/><rect x="474" y="257" width="220" height="144" rx="8" fill="#E2F2EF" stroke="none" stroke-width="1.5"/><text x="584.0" y="338.8" font-size="28" font-weight="normal" fill="#008F86" text-anchor="middle">共享潜向量 c</text><text x="486" y="440" font-size="22" font-weight="normal" fill="#008F86" text-anchor="start">每 token、每层一份</text><line x1="704" y1="329" x2="743" y2="329" stroke="#57789E" stroke-width="2"/><line x1="743" y1="329" x2="743" y2="252" stroke="#57789E" stroke-width="2"/><line x1="743" y1="252" x2="782" y2="252" stroke="#57789E" stroke-width="2" marker-end="url(#arrow-57789E)"/><rect x="792" y="211" width="190" height="82" rx="8" fill="#EAF0F6" stroke="none" stroke-width="1.5"/><text x="887.0" y="260.4" font-size="24" font-weight="normal" fill="#142840" text-anchor="middle">头 1 上投影</text><line x1="992" y1="252" x2="1030" y2="252" stroke="#57789E" stroke-width="2" marker-end="url(#arrow-57789E)"/><rect x="1040" y="211" width="176" height="82" rx="8" fill="#EAF0F6" stroke="none" stroke-width="1.5"/><text x="1128.0" y="261.8" font-size="28" font-weight="normal" fill="#57789E" text-anchor="middle">K / V</text><line x1="704" y1="329" x2="743" y2="329" stroke="#57789E" stroke-width="2"/><line x1="743" y1="329" x2="743" y2="430" stroke="#57789E" stroke-width="2"/><line x1="743" y1="430" x2="782" y2="430" stroke="#57789E" stroke-width="2" marker-end="url(#arrow-57789E)"/><rect x="792" y="389" width="190" height="82" rx="8" fill="#EAF0F6" stroke="none" stroke-width="1.5"/><text x="887.0" y="438.4" font-size="24" font-weight="normal" fill="#142840" text-anchor="middle">头 2 上投影</text><line x1="992" y1="430" x2="1030" y2="430" stroke="#57789E" stroke-width="2" marker-end="url(#arrow-57789E)"/><rect x="1040" y="389" width="176" height="82" rx="8" fill="#EAF0F6" stroke="none" stroke-width="1.5"/><text x="1128.0" y="439.8" font-size="28" font-weight="normal" fill="#57789E" text-anchor="middle">K / V</text><text x="1058" y="346" font-size="20" font-weight="normal" fill="#617286" text-anchor="start">各头投影不同</text><text x="1200" y="508" font-size="26" font-weight="normal" fill="#617286" text-anchor="start">⋮</text></g><g id="joint-equations" data-pptx-replace-with="formula" data-pptx-x="64" data-pptx-y="531" data-pptx-width="1152" data-pptx-height="63" data-pptx-bounds="64 531 1152 63"><metadata type="application/json">{"latex": "c=W^{DKV}h,\\quad k_i^C=W_i^{UK}c,\\quad v_i=W_i^{UV}c", "display": "block", "font_size": 32, "color": "#142840", "align": "center"}</metadata><text x="640.0" y="573.06" font-family="Cambria Math, serif" font-size="32" font-weight="normal" fill="#142840" text-anchor="middle">c = Wᴰᴷⱽ h     kᶜᵢ = Wᵁᴷᵢ c     vᵢ = Wᵁⱽᵢ c</text></g><g id="rank-explanation" data-pptx-bounds="64 603 1152 46"><text x="64" y="633" font-size="24" font-weight="normal" fill="#617286" text-anchor="start">下投影缩小维度，上投影生成各头向量；这种低秩约束需要随模型训练。</text></g><g id="footer" data-pptx-bounds="64 664 1152 32"><line x1="64" y1="665" x2="1216" y2="665" stroke="#D5DFE8" stroke-width="2"/><text x="64" y="690" font-size="16" font-weight="normal" fill="#617286" text-anchor="start">原理依据：DeepSeek-V2 §2.1</text><text x="1216" y="690" font-size="16" font-weight="normal" fill="#617286" text-anchor="end">06 / 29</text></g></svg>