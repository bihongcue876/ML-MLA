<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif"><defs><marker id="arrow-008F86" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#008F86"/></marker><marker id="arrow-57789E" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#57789E"/></marker><marker id="arrow-617286" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#617286"/></marker><marker id="arrow-142840" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#142840"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F7F9FC" stroke="none" stroke-width="1.5"/><g id="heading" data-pptx-bounds="64 28 1152 129" text-anchor="start"><text x="64" y="48" font-size="16" font-weight="bold" fill="#008F86">MLA  /  MLA 原理</text><text x="64" y="106" font-size="40" font-weight="bold" fill="#142840">从压缩缓存到潜空间计算</text><text x="64" y="146" font-size="20" font-weight="normal" fill="#617286">只保存 c 后，注意力仍需要完成键匹配与值的加权。</text></g><g id="reconstruct-path" data-pptx-bounds="64 180 1152 269"><text x="64" y="211" font-size="30" font-weight="bold" fill="#142840" text-anchor="start">直接恢复历史 K/V</text><rect x="64" y="256" width="270" height="80" rx="8" fill="#E2F2EF" stroke="none" stroke-width="1.5"/><text x="199.0" y="305.8" font-size="28" font-weight="normal" fill="#008F86" text-anchor="middle">历史 c₁ … cₜ</text><line x1="344" y1="296" x2="411" y2="296" stroke="#57789E" stroke-width="2" marker-end="url(#arrow-57789E)"/><rect x="421" y="256" width="326" height="80" rx="8" fill="#EAF0F6" stroke="none" stroke-width="1.5"/><text x="584.0" y="305.1" font-size="26" font-weight="normal" fill="#57789E" text-anchor="middle">恢复各头的全部 K/V</text><line x1="757" y1="296" x2="824" y2="296" stroke="#57789E" stroke-width="2" marker-end="url(#arrow-57789E)"/><rect x="834" y="256" width="382" height="80" rx="8" fill="#EAF0F6" stroke="none" stroke-width="1.5"/><text x="1025.0" y="305.8" font-size="28" font-weight="normal" fill="#142840" text-anchor="middle">打分与加权求和</text><text x="421" y="387" font-size="24" font-weight="normal" fill="#617286" text-anchor="start">每个生成步骤都要重新展开历史。</text><text x="421" y="430" font-size="24" font-weight="normal" fill="#617286" text-anchor="start">序列越长，恢复的向量和中间数据越多。</text></g><g id="absorption-motivation" data-pptx-bounds="64 478 1152 164"><rect x="64" y="478" width="1152" height="164" rx="0" fill="#E2F2EF" stroke="none" stroke-width="1.5"/><text x="90" y="520" font-size="30" font-weight="bold" fill="#008F86" text-anchor="start">矩阵吸收（matrix absorption）</text><text x="90" y="564" font-size="26" font-weight="normal" fill="#24384D" text-anchor="start">利用上投影的线性关系改变计算顺序，直接使用潜向量缓存。</text><text x="90" y="609" font-size="24" font-weight="normal" fill="#617286" text-anchor="start">先看内容键和值；位置编码稍后单独加入。</text></g><g id="footer" data-pptx-bounds="64 664 1152 32"><line x1="64" y1="665" x2="1216" y2="665" stroke="#D5DFE8" stroke-width="2"/><text x="64" y="690" font-size="16" font-weight="normal" fill="#617286" text-anchor="start">原理依据：DeepSeek-V2 §2.1</text><text x="1216" y="690" font-size="16" font-weight="normal" fill="#617286" text-anchor="end">07 / 29</text></g></svg>