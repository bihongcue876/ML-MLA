<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif"><defs><marker id="arrow-008F86" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#008F86"/></marker><marker id="arrow-57789E" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#57789E"/></marker><marker id="arrow-617286" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#617286"/></marker><marker id="arrow-142840" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#142840"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F7F9FC" stroke="none" stroke-width="1.5"/><g id="heading" data-pptx-bounds="64 28 1152 129" text-anchor="start"><text x="64" y="48" font-size="16" font-weight="bold" fill="#008F86">MLA  /  论文与实验</text><text x="64" y="106" font-size="40" font-weight="bold" fill="#142840">缓存压缩如何改善服务吞吐</text><text x="64" y="146" font-size="20" font-weight="normal" fill="#617286">服务会同时处理多个请求，每个请求都占用自己的历史缓存。</text></g><g id="service-mechanism" data-pptx-bounds="64 180 1152 187"><rect x="64" y="214" width="330" height="89" rx="8" fill="#E2F2EF" stroke="none" stroke-width="1.5"/><text x="229.0" y="267.6" font-size="26" font-weight="normal" fill="#008F86" text-anchor="middle">每个请求的缓存更小</text><line x1="404" y1="258" x2="448" y2="258" stroke="#008F86" stroke-width="2" marker-end="url(#arrow-008F86)"/><rect x="458" y="214" width="330" height="89" rx="8" fill="#EAF0F6" stroke="none" stroke-width="1.5"/><text x="623.0" y="267.6" font-size="26" font-weight="normal" fill="#142840" text-anchor="middle">显存可容纳更多请求</text><line x1="798" y1="258" x2="842" y2="258" stroke="#008F86" stroke-width="2" marker-end="url(#arrow-008F86)"/><rect x="852" y="214" width="364" height="89" rx="8" fill="#E2F2EF" stroke="none" stroke-width="1.5"/><text x="1034.0" y="267.6" font-size="26" font-weight="normal" fill="#008F86" text-anchor="middle">允许更大批量与吞吐</text><text x="64" y="350" font-size="24" font-weight="normal" fill="#617286" text-anchor="start">权重与工作空间也占显存，吞吐不会按缓存压缩比例直接线性增长。</text></g><g id="paper-cache-elements" data-pptx-bounds="64 394 1152 150" font-size="26" text-anchor="start"><text x="64" y="425" font-weight="bold" fill="#142840">论文 Table 9：同组内缓存元素对照</text><text x="64" y="478" font-weight="normal" fill="#57789E">小 MoE：110.6K → 15.6K，约为原来的14%</text><text x="64" y="525" font-weight="normal" fill="#008F86">大 MoE：860.2K → 34.6K，约为原来的4%</text></g><g id="scaling-scope" data-pptx-bounds="64 565 1152 87"><line x1="64" y1="568" x2="1216" y2="568" stroke="#D5DFE8" stroke-width="2"/><text x="64" y="608" font-size="26" font-weight="bold" fill="#008F86" text-anchor="start">我们的 batch=1 的逐步生成耗时，与多请求服务吞吐是不同指标。</text><text x="64" y="641" font-size="20" font-weight="normal" fill="#617286" text-anchor="start">Table9统计每token全层KV元素，比较对象不同于上一页93.3%，也不涉及量化字节比例。</text></g><g id="footer" data-pptx-bounds="64 664 1152 32"><line x1="64" y1="665" x2="1216" y2="665" stroke="#D5DFE8" stroke-width="2"/><text x="64" y="690" font-size="16" font-weight="normal" fill="#617286" text-anchor="start">文献：DeepSeek-V2 v5；原文位置与详细引用见资料来源表</text><text x="1216" y="690" font-size="16" font-weight="normal" fill="#617286" text-anchor="end">27 / 29</text></g></svg>