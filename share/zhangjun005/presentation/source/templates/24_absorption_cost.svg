<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif"><defs><marker id="arrow-008F86" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#008F86"/></marker><marker id="arrow-57789E" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#57789E"/></marker><marker id="arrow-617286" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#617286"/></marker><marker id="arrow-142840" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#142840"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F7F9FC" stroke="none" stroke-width="1.5"/><g id="heading" data-pptx-bounds="64 28 1152 129" text-anchor="start"><text x="64" y="48" font-size="16" font-weight="bold" fill="#008F86">MLA  /  结果解释</text><text x="64" y="106" font-size="40" font-weight="bold" fill="#142840">矩阵吸收为什么没有稳定加速</text><text x="64" y="146" font-size="20" font-weight="normal" fill="#617286">它省去历史 K/V 的上投影，同时改变了注意力内维与中间张量。</text></g><g id="dimension-cost" data-pptx-bounds="64 180 548 265"><text x="64" y="212" font-size="30" font-weight="bold" fill="#142840" text-anchor="start">注意力内维变宽</text><text x="64" y="272" font-size="26" font-weight="bold" fill="#57789E" text-anchor="start">恢复 K 路径：64 + 32 = 96</text><text x="64" y="324" font-size="26" font-weight="bold" fill="#008F86" text-anchor="start">吸收路径：d_c + 32</text><text x="64" y="374" font-size="24" font-weight="normal" fill="#24384D"><tspan x="64" dy="0">d_c=128 时为160，d_c=384 时为416。</tspan><tspan x="64" dy="43">较宽的点积与聚合，会增加部分计算。</tspan></text></g><g id="materialization-cost" data-pptx-bounds="683 180 533 285"><text x="683" y="212" font-size="30" font-weight="bold" fill="#142840" text-anchor="start">当前独立层仍有张量开销</text><text x="683" y="272" font-size="24" font-weight="normal" fill="#24384D"><tspan x="683" dy="0">把共享 c 展开到头维后，拼接位置键</tspan><tspan x="683" dy="50">拼接操作会物化多头 K 中间张量</tspan><tspan x="683" dy="50">先聚合 c，再做值上投影和输出投影</tspan><tspan x="683" dy="50">这些操作尚未组成融合部署内核</tspan></text></g><g id="memory-distinction" data-pptx-bounds="64 489 1152 65"><rect x="64" y="489" width="1152" height="65" rx="0" fill="#EAF0F6" stroke="none" stroke-width="1.5"/><text x="88" y="530" font-size="26" font-weight="bold" fill="#142840" text-anchor="start">持久缓存更小，仍可能产生较大的临时张量与额外算子开销。</text></g><g id="speed-implication" data-pptx-bounds="64 565 1152 87"><line x1="64" y1="568" x2="1216" y2="568" stroke="#D5DFE8" stroke-width="2"/><text x="64" y="608" font-size="26" font-weight="bold" fill="#008F86" text-anchor="start">当前时延说明这份实现的条件，不能代表所有 MLA 内核的性能。</text><text x="64" y="641" font-size="20" font-weight="normal" fill="#617286" text-anchor="start">本页分析用于计时的独立层实现；优化部署内核的计算与访存安排会不同。</text></g><g id="footer" data-pptx-bounds="64 664 1152 32"><line x1="64" y1="665" x2="1216" y2="665" stroke="#D5DFE8" stroke-width="2"/><text x="64" y="690" font-size="16" font-weight="normal" fill="#617286" text-anchor="start">我们的实验实现与留存记录；对应代码与测量条件见资料来源表</text><text x="1216" y="690" font-size="16" font-weight="normal" fill="#617286" text-anchor="end">24 / 29</text></g></svg>