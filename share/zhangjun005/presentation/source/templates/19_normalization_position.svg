<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif"><defs><marker id="arrow-008F86" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#008F86"/></marker><marker id="arrow-57789E" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#57789E"/></marker><marker id="arrow-617286" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#617286"/></marker><marker id="arrow-142840" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#142840"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F7F9FC" stroke="none" stroke-width="1.5"/><g id="heading" data-pptx-bounds="64 28 1152 129" text-anchor="start"><text x="64" y="48" font-size="16" font-weight="bold" fill="#008F86">MLA  /  实现分析</text><text x="64" y="106" font-size="40" font-weight="bold" fill="#142840">归一化位置与矩阵吸收</text><text x="64" y="146" font-size="20" font-weight="normal" fill="#617286">RMSNorm 按向量幅度归一化；放在上投影前后，计算关系不同。</text></g><g id="official-norm" data-pptx-bounds="64 182 1152 191"><text x="64" y="214" font-size="30" font-weight="bold" fill="#142840" text-anchor="start">官方参考实现</text><rect x="64" y="253" width="170" height="66" rx="8" fill="#E2F2EF" stroke="none" stroke-width="1.5"/><text x="149.0" y="295.1" font-size="26" font-weight="normal" fill="#008F86" text-anchor="middle">低维 c</text><line x1="244" y1="286" x2="288" y2="286" stroke="#008F86" stroke-width="2" marker-end="url(#arrow-008F86)"/><rect x="298" y="253" width="207" height="66" rx="8" fill="#E2F2EF" stroke="none" stroke-width="1.5"/><text x="401.5" y="295.1" font-size="26" font-weight="normal" fill="#008F86" text-anchor="middle">RMSNorm</text><line x1="515" y1="286" x2="559" y2="286" stroke="#008F86" stroke-width="2" marker-end="url(#arrow-008F86)"/><rect x="569" y="253" width="270" height="66" rx="8" fill="#EAF0F6" stroke="none" stroke-width="1.5"/><text x="704.0" y="295.1" font-size="26" font-weight="normal" fill="#142840" text-anchor="middle">线性上投影</text><line x1="849" y1="286" x2="893" y2="286" stroke="#008F86" stroke-width="2" marker-end="url(#arrow-008F86)"/><rect x="903" y="253" width="313" height="66" rx="8" fill="#EAF0F6" stroke="none" stroke-width="1.5"/><text x="1059.5" y="295.1" font-size="26" font-weight="normal" fill="#57789E" text-anchor="middle">各头内容键</text><text x="64" y="360" font-size="24" font-weight="normal" fill="#008F86" text-anchor="start">缓存归一化后的潜向量，上投影仍然是线性映射。</text></g><g id="repo-norm" data-pptx-bounds="64 394 1152 145"><text x="64" y="423" font-size="30" font-weight="bold" fill="#142840" text-anchor="start">我们的模型实现</text><rect x="64" y="460" width="170" height="66" rx="8" fill="#E2F2EF" stroke="none" stroke-width="1.5"/><text x="149.0" y="502.1" font-size="26" font-weight="normal" fill="#008F86" text-anchor="middle">低维 c</text><line x1="244" y1="493" x2="288" y2="493" stroke="#57789E" stroke-width="2" marker-end="url(#arrow-57789E)"/><rect x="298" y="460" width="207" height="66" rx="8" fill="#EAF0F6" stroke="none" stroke-width="1.5"/><text x="401.5" y="501.4" font-size="24" font-weight="normal" fill="#142840" text-anchor="middle">线性上投影</text><line x1="515" y1="493" x2="559" y2="493" stroke="#57789E" stroke-width="2" marker-end="url(#arrow-57789E)"/><rect x="569" y="460" width="270" height="66" rx="8" fill="#EAF0F6" stroke="none" stroke-width="1.5"/><text x="704.0" y="501.4" font-size="24" font-weight="normal" fill="#57789E" text-anchor="middle">每头 K 的 RMSNorm</text><line x1="849" y1="493" x2="893" y2="493" stroke="#57789E" stroke-width="2" marker-end="url(#arrow-57789E)"/><rect x="903" y="460" width="313" height="66" rx="8" fill="#EAF0F6" stroke="none" stroke-width="1.5"/><text x="1059.5" y="502.1" font-size="26" font-weight="normal" fill="#57789E" text-anchor="middle">归一化后的键</text></g><g id="norm-implication" data-pptx-bounds="64 565 1152 87"><line x1="64" y1="568" x2="1216" y2="568" stroke="#D5DFE8" stroke-width="2"/><text x="64" y="608" font-size="26" font-weight="bold" fill="#008F86" text-anchor="start">展开键的归一化分母依赖历史 token，限制简单的固定矩阵吸收。</text><text x="64" y="641" font-size="20" font-weight="normal" fill="#617286" text-anchor="start">因此主模型质量和独立层吸收计时分开分析；RMSNorm本身并不与MLA冲突。</text></g><g id="footer" data-pptx-bounds="64 664 1152 32"><line x1="64" y1="665" x2="1216" y2="665" stroke="#D5DFE8" stroke-width="2"/><text x="64" y="690" font-size="16" font-weight="normal" fill="#617286" text-anchor="start">我们的实验实现与留存记录；对应代码与测量条件见资料来源表</text><text x="1216" y="690" font-size="16" font-weight="normal" fill="#617286" text-anchor="end">19 / 29</text></g></svg>